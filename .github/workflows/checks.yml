name: checks
# Calls practice-library/.github's reusable workflows at one pinned commit. The gate's needs must
# equal the jobs in .github/required-checks.json.
# discover and schema-check join when this repository has a check.json to validate. unit runs on both CI
# arches, with the guards; build checks the example builds to the same bytes twice; conformance joins when
# machinery's contract tag carries conformance/runtime/.
on:
  pull_request:
    branches: [main]
    # labeled and unlabeled re-run schema-loosening when a maintainer adds or removes its label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Modules are the ones go.sum pins
        run: |
          GOFLAGS=-mod=readonly go mod download
          GOFLAGS=-mod=readonly go mod verify
      - name: go vet
        run: GOFLAGS=-mod=readonly go vet ./...
      - name: go test -race
        run: GOFLAGS=-mod=readonly go test -race -count=1 ./...
      - name: govulncheck v1.9.0 over the module
        run: GOFLAGS=-mod=readonly go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Each guard, removed, makes the tests fail
        run: GOFLAGS=-mod=readonly go run ./tests/guards
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The example builds to the same bytes twice
        run: |
          set -euo pipefail
          for n in 1 2; do
            CGO_ENABLED=0 GOFLAGS=-mod=readonly go build -trimpath -o "$RUNNER_TEMP/minimal-$n" ./examples/minimal
            go clean -cache
          done
          sha256sum "$RUNNER_TEMP/minimal-1" "$RUNNER_TEMP/minimal-2"
          cmp "$RUNNER_TEMP/minimal-1" "$RUNNER_TEMP/minimal-2"
  leak-scan:
    uses: practice-library/.github/.github/workflows/leak-scan.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
  denylist:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      guard: denylist
  removed-paths:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      guard: removed-paths
  release-note:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      guard: release-note
  schema-loosening:
    permissions:
      contents: read
      pull-requests: read
    uses: practice-library/.github/.github/workflows/guard.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      guard: schema-loosening
  gate:
    if: always()
    needs: [unit, build, leak-scan, denylist, removed-paths, release-note, schema-loosening]
    uses: practice-library/.github/.github/workflows/gate.yml@1dd90884cca4277db278eb7d4ea17eaebf21e563 # v2.1.0
    with:
      needs: ${{ toJSON(needs) }}
